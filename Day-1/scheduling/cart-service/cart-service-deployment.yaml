apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: application
  labels:
    app: microservices-demo
    component: cart-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservices-demo
      component: cart-service
  template:
    metadata:
      labels:
        app: microservices-demo
        component: cart-service
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - worker-10.wescale.internal
      containers:
        - name: cart-service
          image: europe-west1-docker.pkg.dev/wsc-kubernetes-training-0/microservices-demo/cart-service:1.0.0
          env:
          - name: REDIS_URI
            value: redis://redis:6379
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources: {}
          volumeMounts:
          - name: config
            mountPath: config.yaml
            subPath: config.yaml
      volumes:
      - name: config
        configMap:
          name: cart-service
