apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: application
  labels:
    app: microservices-demo
    component: cart-service
spec:
  type: ClusterIP
  selector:
    app: microservices-demo
    component: cart-service
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
