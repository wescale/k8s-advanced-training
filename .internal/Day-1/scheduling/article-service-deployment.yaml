apiVersion: apps/v1
kind: Deployment
metadata:
  name: article-service
  namespace: application
  labels:
    app: microservices-demo
    component: article-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: microservices-demo
      component: article-service
  template:
    metadata:
      labels:
        app: microservices-demo
        component: article-service
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: component
                operator: In
                values:
                - mongodb
            topologyKey: kubernetes.io/hostname
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: component
                  operator: In
                  values:
                  - front-admin
              topologyKey: kubernetes.io/hostname
      containers:
        - name: article-service
          image: europe-west1-docker.pkg.dev/wsc-kubernetes-training-0/microservices-demo/front-admin:2.0.3
          env:
          - name: MONGODB_URI
            value: mongodb://mongodb:27017/alpha-articles
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources: {}
          volumeMounts:
          - name: config
            mountPath: config.yaml
            subPath: config.yaml
      volumes:
      - name: config
        configMap:
          name: article-service
